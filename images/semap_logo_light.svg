<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" width="100%" height="100%">
  <!-- SEMAP Full Logo (Light Theme) -->
  <defs>
    <filter id="semap-light-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#semap-light-shadow)">
    <!-- Top Face (Royal Blue) -->
    <polygon points="107,6 208,65 107,126 6,65" fill="#3B82F6" stroke="#2563EB" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Left Face (Vibrant Violet Purple) -->
    <polygon points="6,65 107,126 107,248 6,197" fill="#8B5CF6" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Right Face (Forest / Emerald Green) -->
    <polygon points="107,126 208,65 208,197 107,248" fill="#16A34A" stroke="#15803D" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Center Connecting Node (Light Cyan Blue) -->
    <circle cx="107" cy="126" r="13" fill="#60A5FA" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>
  <!-- Typography -->
  <text x="260" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="118" font-weight="900" fill="#0F172A" letter-spacing="-1.5">SEMAP</text>
  <text x="265" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="600" fill="#64748B" letter-spacing="1">Intelligence Prism</text>
</svg>